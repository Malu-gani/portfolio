name: Report a problem
description: Tell me about a defect you found on the site
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The more concrete the report, the faster it
        can be reproduced and fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 141 on Windows 11
    validations:
      required: false
  - type: input
    id: screen
    attributes:
      label: Screen size
      placeholder: Desktop 1920x1080, or "phone"
    validations:
      required: false
