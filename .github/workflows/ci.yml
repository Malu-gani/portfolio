name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificación de tipos
        run: npm run check

      - name: Tests unitarios
        run: npm run test:unit

      - name: Compilar
        run: npm run build

      - name: Lighthouse
        run: npm run test:lighthouse

      - name: Contenido pendiente de reemplazo (no bloqueante)
        # El sitio todavía tiene contenido de ejemplo (`ejemplo: true` en varias
        # colecciones); check:listo está pensado para dar rojo hasta que se
        # reemplace por casos y proyectos reales antes de publicar. Bloquear el
        # pipeline con esto haría que el CI nazca rojo, así que se corre en modo
        # informativo (continue-on-error) para que el estado quede visible en
        # el resumen del job sin tumbar el badge. Sacar `continue-on-error`
        # cuando el contenido real reemplace al de ejemplo.
        run: npm run check:listo
        continue-on-error: true

  e2e:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores
        run: npx playwright install --with-deps

      - name: Tests E2E y de accesibilidad (${{ matrix.project }})
        # --workers=1: correr los 4 proyectos de Playwright en paralelo (o un
        # solo proyecto con sus workers por defecto) contra un único
        # `npm run preview` local satura ese servidor y produce
        # NS_ERROR_CONNECTION_REFUSED de forma intermitente en una ruta
        # distinta cada vez -- diagnosticado y reproducido en
        # docs/cross-browser-diagnostico.md.
        # Cada proyecto ya corre aislado en su propio job de esta matriz (cada
        # uno con su propio runner y su propio `npm run preview`), lo que
        # elimina la contención ENTRE proyectos; --workers=1 elimina también
        # la contención DENTRO de un mismo proyecto, que es la que de hecho
        # disparó el error en el diagnóstico (firefox solo, con sus 3 workers
        # por defecto, ya lo reproducía). Es una decisión conservadora --
        # cambia paralelismo por estabilidad -- y no está probada en un
        # runner de CI real, solo en local.
        #
        # No se excluyen "enlaces externos" ni la regresión visual acá: ambos
        # describes ya se saltan solos con `test.skip(!!process.env.CI, ...)`
        # (en enlaces.spec.ts y visual.spec.ts respectivamente), así que
        # excluirlos también por CLI sería redundante y frágil (dependería de
        # la capitalización exacta de un título en español).
        run: npx playwright test --project=${{ matrix.project }} --workers=1

      - name: Publicar reporte de Playwright (${{ matrix.project }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30

  publicar-reporte:
    needs: e2e
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Descargar los reportes de los 4 proyectos
        # Sin merge-multiple: cada artefacto (uno por proyecto de Playwright)
        # cae en su propio subdirectorio "reporte-descargado/<nombre-del-
        # artefacto>/". Con merge-multiple:true los 4 reportes HTML comparten
        # nombres de archivo (index.html, data/) y se pisan entre sí -- lo
        # publicado terminaba siendo una mezcla de un solo proyecto. Así se
        # publican los 4 reportes completos, cada uno en su propia carpeta.
        # Cuando `e2e` queda saltado (p. ej. si `verificar` falló) no hay
        # artefactos que bajar. Con `pattern` eso no es un error: la acción
        # solo lanza si no encuentra un `name` o un `artifact-ids` explícito,
        # así que acá no baja nada y sigue de largo. El paso siguiente decide
        # si hay algo que publicar.
        uses: actions/download-artifact@v8
        with:
          pattern: playwright-report-*
          path: reporte-descargado

      - name: Verificar si hay reporte para publicar
        # `e2e` corre con `if: always() && ref == main`, así que este job se
        # ejecuta aunque `e2e` haya quedado `skipped` (p. ej. si `verificar`
        # falló). En ese caso no hay artefactos y el directorio no existe o
        # queda vacío. Publicar en ese estado no tiene sentido y antes hacía
        # fallar el job entero con ENOENT al intentar leerlo. Se detecta acá
        # y se salta el paso de publicación sin marcar el job en rojo.
        id: chequeo
        run: |
          if [ -d reporte-descargado ] && [ -n "$(find reporte-descargado -mindepth 1 -print -quit)" ]; then
            echo "hay_reporte=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay_reporte=false" >> "$GITHUB_OUTPUT"
            echo "::notice::e2e no produjo artefactos para publicar (job saltado o sin reportes)."
          fi

      - name: Publicar el reporte en Pages
        if: steps.chequeo.outputs.hay_reporte == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reporte-descargado
          destination_dir: reporte
